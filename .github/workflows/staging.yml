name: Staging Deploy

# A feature branch merged into `staging` (via PR, merge commit) is tested again and then
# deployed to the staging environment: Cloud Run service docsync-staging (served at
# vars.STAGING_DOMAIN when set) and Firestore database "staging".
# The deploy job waits for the owner's approval on the `staging` GitHub environment.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to Staging
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless sign-in to Google Cloud
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment_url || vars.STAGING_URL }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy
        id: deploy
        env:
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: bash scripts/ci/deploy.sh staging

  verify:
    name: Post-Deploy Verification (Staging)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Contract tests against staging
        env:
          TARGET_URL: ${{ needs.deploy.outputs.deployment_url || vars.STAGING_URL }}
          EXPECTED_ENVIRONMENT: staging
          EXPECTED_VERSION: ${{ github.sha }}
          CI: true
        run: npm run test:contract
      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-contract-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14
